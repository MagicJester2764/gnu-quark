# What init does once the root filesystem is up.
#
# First the console's font. The console is UTF-8 and draws ASCII out of what
# it was built with; everything else it draws is in a font it is given, and
# this gives it GNU Unifont.
run /usr/bin/setfont /usr/share/consolefonts/unifont.hex

# getty puts the session on the console's terminal and runs login there. With
# no such line init would start login straight onto the console, where nothing
# is a terminal — and bash would have no prompt to edit.
session /usr/bin/getty
